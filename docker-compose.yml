services:
  # Base de Datos PostgreSQL (sirve llabrown y fiscaliza)
  db:
    image: postgres:16-alpine
    container_name: llabrown-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lla_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lla_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-llabrown}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lla_user} -d ${POSTGRES_DB:-llabrown}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - llabrown-net

  # Aplicación Web Next.js Standalone (Puerto 3000)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llabrown-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lla_user}:${POSTGRES_PASSWORD:-lla_password_2026}@db:5432/${POSTGRES_DB:-llabrown}
      NODE_ENV: production
      PORT: 3000
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - llabrown-net

  # Sistema de Fiscalización Electoral (SPA /fiscalizacion + API Express/Prisma en Puerto 3001)
  fiscalizacion:
    build:
      context: ./fiscalizacion
      dockerfile: Dockerfile
    container_name: llabrown-fiscalizacion
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lla_user}:${POSTGRES_PASSWORD:-lla_password_2026}@db:5432/fiscaliza
      JWT_SECRET: ${FISCALIZA_JWT_SECRET:-lla-brown-fiscalizacion-jwt-secret-2026}
      PORT: 3001
      NODE_ENV: production
    volumes:
      - fiscaliza_uploads:/app/api/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - llabrown-net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  fiscaliza_uploads:
    driver: local

networks:
  llabrown-net:
    driver: bridge
